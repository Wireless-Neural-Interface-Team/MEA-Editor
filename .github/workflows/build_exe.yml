name: Build executable

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ElectrodeArrayEditor.exe
          - os: ubuntu-latest
            artifact: ElectrodeArrayEditor
          - os: macos-latest
            artifact: ElectrodeArrayEditor
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install package and build extra
        run: pip install -e ".[build]"

      - name: Build standalone executable
        run: mea-editor-build

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ runner.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

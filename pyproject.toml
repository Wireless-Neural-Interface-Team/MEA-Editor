[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mea_editor*"]

[tool.setuptools.dynamic]
version = {attr = "mea_editor._version.__version__"}

[project]
name = "mea_editor"
dynamic = ["version"]
description = "GUI and library to create and modify MEA (Multi-Electrode Arrays), with optional SpikeInterface export"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Wireless Neural Interface Team"},
    {name = "Pierre He", email = "pierre.he@inserm.fr"},
]
keywords = ["MEA", "electrode", "spikeinterface", "neuroscience", "electrophysiology"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "PySide6>=6.5.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
build = [
    "pyinstaller>=6.0",
]


[project.urls]
Homepage = "https://github.com/Wireless-Neural-Interface-Team/mea_editor"
Repository = "https://github.com/Wireless-Neural-Interface-Team/mea_editor"

[project.scripts]
mea-editor = "mea_editor.electrode_array_editor_qt:run_app"
mea-editor-gui = "mea_editor.electrode_array_editor_qt:run_app"
mea-editor-build = "mea_editor.build_exe:main"
mea-editor-gui-build = "mea_editor.build_exe:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
